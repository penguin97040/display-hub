# cargo-about's settings for the Rust part of THIRD-PARTY-NOTICES.txt. tools/notices/generate.sh
# runs it offline (--frozen), so only the crates' own files are read, never the network.

# The licences deny.toml allows, in the same order: a crate offering a choice is listed under the
# first one here that it offers. generate.sh fails if the two lists differ.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# The platforms the downloads are built for: Windows, Apple silicon, Linux on x86-64, and the
# Raspberry Pi (aarch64 Linux).
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Build scripts and tests don't end up in the programs.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Display Hub's own crates (publish = false) are under LICENSE, not listed here.
[private]
ignore = true

# MPL-2.0, one crate at a time, as in deny.toml. cbindgen, the fourth there, is a build tool and
# isn't shipped. THIRD-PARTY-NOTICES.txt says where their source is.
[dwrote]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]

[serialport]
accepted = ["MPL-2.0"]
