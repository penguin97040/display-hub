name: Release

# Pushing a tag such as v0.1.0 (or v0.1.0-rc.1) builds every download and makes a DRAFT release
# from them. Nothing is published: the owner reads the draft, adds what's new and publishes it on
# GitHub. Push the tag on a commit whose CI has passed: this repeats the builds, not the tests.
on:
  push:
    tags: ["v*"]

# Read only, except the last job, which makes the draft. Actions are pinned to commits, so a moved
# tag can't change what runs. No caches: a release is built from scratch.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  pi:
    # The Raspberry Pi download, built as CI builds it (aarch64 against glibc 2.36, so it runs on
    # Raspberry Pi OS Bookworm and Trixie). Its address and checksum go into the app builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      preview: ${{ steps.tag.outputs.preview }}
      name: ${{ steps.tag.outputs.name }}
      tarball: ${{ steps.pack.outputs.tarball }}
      url: ${{ steps.pack.outputs.url }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag against the versions
        id: tag
        run: python3 -I tools/release/check-version.py "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      # Every download carries THIRD-PARTY-NOTICES.txt, so it must match this tag's Cargo.lock even
      # if the tag went on a commit whose CI hadn't passed. Same pinned version as CI.
      - name: Third-party notices are up to date
        run: |
          cargo install --locked --root "$RUNNER_TEMP/cargo-tools" --version 0.9.3 --features cli cargo-about
          cargo fetch --locked
          CARGO_ABOUT="$RUNNER_TEMP/cargo-tools/bin/cargo-about" bash tools/notices/generate.sh --check
      - uses: ./.github/actions/zigbuild
      - name: Check the scripts
        run: |
          shellcheck tools/release/pi-tarball.sh tools/release/package-app.sh tools/release/build-pi.sh \
            tools/release/release-notes.sh deploy/raspberry-pi/install.sh
      - name: Build hubd and hub-send for the Pi, and pack them
        id: pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          bins=$(bash tools/release/build-pi.sh)
          file=$(bash tools/release/pi-tarball.sh "$bins" "$VERSION" release-out)
          name=${file##*/}
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          # It must unpack to display-hub-pi/ with the installer and both programs ready to run.
          python3 -I tools/release/check-package.py pi "$VERSION" release-out
          tar -tvzf "$file"
          {
            echo "tarball=$name"
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
            echo "sha256=$sha"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-pi
          path: release-out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  firmware:
    # The official firmware, built from this tag's source as CI builds it: in Espressif's own
    # ESP-IDF v5.5.6 image, pinned by digest. Nothing here is signed, and no key is ever here: the
    # build is only what the owner's signed package is checked against, in the next job.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.6@sha256:bf72fe7a15c22849a9a94147301165a545fb8905d97c176cf748e3e4614cac84
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The lock file must already say exactly what the build downloads.
      - name: Build
        run: |
          set -o pipefail
          . "$IDF_PATH/export.sh"
          cp firmware/dependencies.lock "$RUNNER_TEMP/dependencies.lock"
          idf.py -C firmware -B "$RUNNER_TEMP/fw-build" build
          cmp firmware/dependencies.lock "$RUNNER_TEMP/dependencies.lock"
          mkdir -p fw-out/bootloader fw-out/partition_table
          cd "$RUNNER_TEMP/fw-build"
          cp flasher_args.json display-hub.bin display-hub.elf ota_data_initial.bin "$GITHUB_WORKSPACE/fw-out/"
          cp bootloader/bootloader.bin "$GITHUB_WORKSPACE/fw-out/bootloader/"
          cp partition_table/partition-table.bin "$GITHUB_WORKSPACE/fw-out/partition_table/"
          sha256sum display-hub.bin bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin
      # As in CI: the firmware's notices must have been written from what is in this build.
      - name: Check the firmware's parts against the notices
        run: python3 -I tools/notices/firmware-parts.py "$RUNNER_TEMP/fw-build" | diff -u tools/notices/firmware-parts.txt -
      # Not named release-*: it isn't a download.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-build
          path: fw-out
          if-no-files-found: error
          retention-days: 7

  official-firmware:
    # The package the owner signed on their own computer and committed (firmware/official/), held
    # against the build above: the same bytes, this release's version, the official board, signed
    # by an official key, with the official keys as its key set, and those keys built into the app.
    # No package, or one that differs in any of that, and there is no release. The checked file is
    # what the app downloads carry.
    needs: [pi, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.pi.outputs.version }}
    outputs:
      name: ${{ steps.check.outputs.name }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build hub-firmware
        run: cargo build --release --locked -p hub-firmware
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firmware-build
          path: fw-out
      # The firmware's version is the programs': a tag's -rc.N or -test.N isn't part of it.
      - name: Check the official package against the build
        id: check
        run: |
          python3 -I tools/release/check-official-firmware.py --dir firmware/official --build fw-out \
            --hub-firmware target/release/hub-firmware --app-keys apps/hub-manager/src/firmware.rs \
            --version "${VERSION%%-*}"
          mkdir official-firmware
          cp firmware/official/*.dhfw official-firmware/
          file=$(ls official-firmware)
          {
            echo "name=$file"
            echo "sha256=$(sha256sum "official-firmware/$file" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_OUTPUT"
      # Not named release-*: it travels inside the app downloads, not beside them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-firmware
          path: official-firmware/*.dhfw
          if-no-files-found: error
          retention-days: 7

  apps:
    # The desktop app and the command-line tools, with the Pi download's name, address and checksum
    # built in, so the app's first-run guide shows the one line that installs the hub, and with the
    # checked official firmware package beside the app, where it looks for it.
    needs: [pi, official-firmware]
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: windows
            exe: .exe
            python: python
          - os: macos-15 # Apple silicon
            platform: macos
            exe: ""
            python: python3
          - os: ubuntu-24.04
            platform: linux
            exe: ""
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
      EXE: ${{ matrix.exe }}
      PYTHON: ${{ matrix.python }}
      VERSION: ${{ needs.pi.outputs.version }}
      DISPLAY_HUB_PI_TARBALL: ${{ needs.pi.outputs.tarball }}
      DISPLAY_HUB_PI_URL: ${{ needs.pi.outputs.url }}
      DISPLAY_HUB_PI_SHA256: ${{ needs.pi.outputs.sha256 }}
      FIRMWARE: ${{ needs.official-firmware.outputs.name }}
      FIRMWARE_SHA256: ${{ needs.official-firmware.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake pkg-config \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-xkb-dev \
            libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev
      - name: Build
        run: |
          cargo build --release --locked -p hub-manager -p hub-send -p hub-firmware \
            -p display-simulator -p usage-helper
      # The build refuses a malformed address or checksum; this shows they reached the app at all.
      - name: Check the Pi line is built in
        run: grep -qaF "$DISPLAY_HUB_PI_SHA256" "target/release/hub-manager$EXE"
      # As in CI: Windows' software renderer, so this proves the window opens and draws.
      - name: Smoke test the desktop manager
        if: matrix.platform == 'windows'
        run: |
          set -o pipefail
          timeout 180 target/release/hub-manager.exe --smoke-test | tee smoke.log
          grep -qx launched smoke.log
          grep -qx rendered smoke.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: official-firmware
          path: official-firmware
      # Relative paths for the check: Python on Windows doesn't read Git Bash's /d/... paths. The
      # firmware package must be the very file the check passed, and must be in the download.
      - name: Pack
        run: |
          fw="official-firmware/$FIRMWARE"
          "$PYTHON" -I -c 'import hashlib, sys; sys.exit(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest() != sys.argv[2])' \
            "$fw" "$FIRMWARE_SHA256" || { echo "$fw isn't the package that was checked"; exit 1; }
          bash tools/release/package-app.sh "$PLATFORM" "$VERSION" target/release release-out "$fw"
          "$PYTHON" -I tools/release/check-package.py "$PLATFORM" "$VERSION" release-out "$fw"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  release:
    # Makes the draft release, with SHA256SUMS and notes from .github/release-notes.md. It never
    # publishes: that's the owner's call, on GitHub.
    needs: [pi, apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.pi.outputs.version }}
      PRERELEASE: ${{ needs.pi.outputs.prerelease }}
      PREVIEW: ${{ needs.pi.outputs.preview }}
      TITLE: ${{ needs.pi.outputs.name }}
      PI_TARBALL: ${{ needs.pi.outputs.tarball }}
      PI_URL: ${{ needs.pi.outputs.url }}
      PI_SHA256: ${{ needs.pi.outputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag against the versions
        run: python3 -I tools/release/check-version.py "$TAG"
      # The partner of upload-artifact, from the same publisher: the only way to collect what the
      # other jobs built.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-out
          merge-multiple: true
      - name: Check the files and write SHA256SUMS
        run: |
          cd release-out
          expected=$(printf '%s\n' "$PI_TARBALL" "display-hub-linux-x64-$VERSION.tar.gz" \
            "display-hub-macos-arm64-$VERSION.zip" "display-hub-windows-x64-$VERSION.zip" | sort)
          got=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          [ "$got" = "$expected" ] || { echo "expected:"; echo "$expected"; echo "got:"; echo "$got"; exit 1; }
          echo "$PI_SHA256  $PI_TARBALL" | sha256sum -c -
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Write the notes
        run: |
          bash tools/release/release-notes.sh "$TAG" "$VERSION" "$PREVIEW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$PI_TARBALL" "$PI_URL" "$PI_SHA256" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Make the draft release
        run: |
          # GitHub lets several drafts share a tag, so a re-run would make a second one: refuse.
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .html_url')
          if [ -n "$existing" ]; then
            echo "There's already a release for $TAG: $existing. Delete it on GitHub first, then re-run."
            exit 1
          fi
          args=(--draft --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md")
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" release-out/*
