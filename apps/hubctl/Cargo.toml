[package]
name = "hubctl"
version = "0.1.0"
description = "Display Hub PC helper: forwards usage figures that Claude Code and Codex already report on this PC"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hubctl"
path = "src/main.rs"

# Windows: the same Codex sync without a console window, for Task Scheduler.
[[bin]]
name = "hubctl-sync"
path = "src/bin/hubctl-sync.rs"

[dependencies]
hub-protocol.workspace = true
hub-core.workspace = true
hub-client.workspace = true
os-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
dirs.workspace = true
zeroize.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
hubd = { path = "../hubd" }
tempfile.workspace = true
base64.workspace = true
