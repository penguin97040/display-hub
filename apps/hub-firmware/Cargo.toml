[package]
name = "hub-firmware"
version = "0.1.0"
description = "Display Hub: makes signing keys, signs and checks firmware packages, and adds them to a hub, for display makers"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hub-firmware"
path = "src/main.rs"

[dependencies]
firmware-package.workspace = true
hub-protocol.workspace = true
hub-core.workspace = true
hub-client.workspace = true
hub-send = { path = "../hub-send" }
os-secrets.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
hubd = { path = "../hubd" }
base64.workspace = true
