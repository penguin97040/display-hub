[package]
name = "hub-firmware"
version = "0.1.0"
description = "Display Hub: makes signing keys, and signs and checks firmware packages, for display makers"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hub-firmware"
path = "src/main.rs"

[dependencies]
firmware-package.workspace = true
clap.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
