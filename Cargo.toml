[workspace]
resolver = "2"
members = [
    "crates/hub-protocol",
    "crates/hub-core",
    "crates/hub-client",
    "apps/hubd",
    "apps/hub-manager",
    "tools/display-simulator",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.99"

# GPUI's Windows backend, with the change that lets a Linux host cross-build it (see vendor/README.md).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# Every version is pinned exactly and Cargo.lock is committed. Upgrade deliberately, on a branch.
[workspace.dependencies]
hub-protocol = { path = "crates/hub-protocol" }
hub-core = { path = "crates/hub-core" }
hub-client = { path = "crates/hub-client" }

# GPUI: a crates.io snapshot of Zed's GPUI. 0.3.11 matches md-viewer, so the vendored Windows backend applies.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-pre-windows = { version = "=0.3.11", default-features = false }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
unicode-normalization = "=0.1.26"
unicode-segmentation = "=1.13.3"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "=0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "=0.7.1", features = ["limit", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
ring = "=0.17.14"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["server", "server-graceful", "http1", "tokio", "service"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
base64 = "=0.23.1"
crc32fast = "=1.5.5"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
libc = "=0.2.191"
# libudev off: port listing falls back to sysfs on Linux, so no system library is needed.
serialport = { version = "=4.10.1", default-features = false }
zeroize = "=1.9.1"
# The desktop manager's admin token lives in the OS credential store, never a plain file.
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }
dirs = "=6.0.0"
jsonschema = { version = "=0.61.1", default-features = false }
tempfile = "=3.27.0"
url = "=2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
