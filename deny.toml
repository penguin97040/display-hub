[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# All of these come from the pinned GPUI stack (the desktop manager only, never hubd), are
# flagged unmaintained rather than vulnerable, and can't be upgraded from here. Each says why it
# is accepted. Review the list whenever GPUI is upgraded. .cargo/audit.toml mirrors the ids.
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, from usvg in GPUI: shapes text from the bundled fonts in the manager's own SVG icons. No untrusted input." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, from GPUI's font stack: parses the bundled fonts and system fonts, never fonts from the network." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, Linux only (GPUI portals and accessibility): merged into zbus 6, which GPUI has to adopt." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, Linux only, as zbus_names." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, Linux only, as zbus_names." },
    { id = "RUSTSEC-2024-0436", reason = "paste, from GPUI image dependencies: a compile-time macro, no code in the executable." },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
private = { ignore = true }
# MPL-2.0 is copyleft per file, not for the whole program. These are used unmodified, and their
# source stays available on crates.io. Allowed one crate at a time, so a new one gets looked at.
exceptions = [
    { allow = ["MPL-2.0"], crate = "dwrote" },      # DirectWrite bindings (GPUI font stack)
    { allow = ["MPL-2.0"], crate = "option-ext" },  # dirs-sys, from GPUI's font-kit
    { allow = ["MPL-2.0"], crate = "cbindgen" },    # macOS build script only, not shipped
]

[bans]
# Duplicate versions come from the pinned GPUI stack and can't be fixed from here.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
